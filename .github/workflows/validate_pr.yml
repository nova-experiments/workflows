name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-description:
    name: Ensure PR description has linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Validate description
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            // gather all referenced issue numbers (either #123 or full issue URL)
            const issueRegex = /(?:#(\d+)|https:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/(\d+))/g;
            let match;
            const issues = new Set();
            while ((match = issueRegex.exec(body)) !== null) {
              issues.add(match[1] || match[2]);
            }

            if (issues.size === 0) {
              core.setFailed('Pull request description must include atleast one linked issue.');
              return;
            }

            // verify each issue exists and is open
            for (const number of issues) {
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                });

                if (response.data.state !== 'open') {
                  const msg = `Referenced issue #${number} is not open (state: ${response.data.state}).`;
                  // comment on the issue to explain why validation failed
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: number,
                    body: `⚠️ PR validation failed: ${msg}`,
                  });
                  core.setFailed(msg);
                }
              } catch (error) {
                const msg = `Unable to fetch issue #${number}: ${error.message}`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body: `⚠️ PR validation encountered an error: ${msg}`,
                });
                core.setFailed(msg);
              }
            }
