name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-description:
    name: Ensure PR description has linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Validate description
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';
            // combine title and body to search both places
            const text = `${title}\n${body}`;
            // gather all referenced issue numbers (either #123 or full issue URL)
            const issueRegex = /(?:#(\d+)|https:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/(\d+))/g;
            let match;
            const issues = new Set();
            while ((match = issueRegex.exec(text)) !== null) {
              issues.add(match[1] || match[2]);
            }

            if (issues.size === 0) {
              core.setFailed('Pull request description must include atleast one linked issue.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            // verify each issue exists and is open
            for (const number of issues) {
              console.log(`Checking referenced issue #${number}...`);
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                });

                // ensure the thing we fetched is actually an issue, not a pull request
                if (response.data.pull_request) {
                  const msg = `Referenced number #${number} refers to a pull request, not an issue.`;
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `⚠️ PR validation failed: ${msg}`,
                  });
                  core.setFailed(msg);
                  break;
                }

                // Ensure the issue is not in a closed state
                console.log(`Referenced issue #${number}... is not a pull request. State: ${response.data.state}`);
                if (response.data.state == 'closed') {
                  const msg = `Referenced issue #${number} is not open (state: ${response.data.state}).`;
                  // comment on the pull request to explain why validation failed
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `⚠️ PR validation failed: ${msg}`,
                  });
                  core.setFailed(msg);
                }
              } catch (error) {
                const msg = `Unable to fetch issue #${number}: ${error.message}`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `⚠️ PR validation encountered an error: ${msg}`,
                });
                core.setFailed(msg);
              }
            }
